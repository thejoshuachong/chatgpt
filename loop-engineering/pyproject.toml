[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering-estate"
version = "0.1.0"
description = "Canonical registry and assurance harness for LOOP ENGINEERING ∞ + × PARALLEL AGENTS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
