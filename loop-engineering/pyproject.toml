[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering-estate"
version = "0.2.0"
description = "Operational registry, mission engine, and assurance harness for LOOP ENGINEERING ∞ + × PARALLEL AGENTS"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
loop-estate = "loop_engineering.cli:main"

[tool.setuptools]
packages = ["loop_engineering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
