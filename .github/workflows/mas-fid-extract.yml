name: MAS FID Extract

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Extract MAS directory
        id: extract
        continue-on-error: true
        env:
          EXPECTED_COUNT: '3640'
        run: python scripts/extract_mas_fid.py

      - name: Commit extraction output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output || true
          if ! git diff --cached --quiet; then
            git commit -m "Add MAS FID extraction output"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi

      - name: Upload extraction files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mas-fid-output
          path: output/
          retention-days: 7

      - name: Enforce validation
        if: steps.extract.outcome != 'success'
        run: exit 1
