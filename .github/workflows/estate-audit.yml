name: Scheduled Estate Audit

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loop-engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: loop-engineering/pyproject.toml
      - name: Install estate package
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'
      - name: Run registry and assurance suite
        id: assurance
        continue-on-error: true
        run: |
          python -m loop_engineering registry build
          python -m loop_engineering registry validate
          pytest
          python -m loop_engineering audit --output audit-report.md
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-estate-audit-${{ github.run_number }}
          path: loop-engineering/audit-report.md
      - name: Create or update assurance incident
        if: steps.assurance.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        working-directory: .
        run: |
          TITLE="LOOP ENGINEERING scheduled assurance failure"
          BODY=$(cat <<EOF
          The scheduled estate audit failed.

          - Workflow run: ${RUN_URL}
          - Commit: ${GITHUB_SHA}
          - Required response: inspect the failing invariant, preserve evidence, remediate on a branch, and rerun assurance before release.

          This issue is an operational alert, not evidence that the estate has been empirically validated.
          EOF
          )
          EXISTING=$(gh issue list --repo "$REPOSITORY" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
      - name: Fail workflow after evidence capture
        if: steps.assurance.outcome != 'success'
        run: exit 1
