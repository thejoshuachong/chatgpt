name: MAS FID Diagnose

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium

      - name: Diagnose MAS directory requests
        run: python scripts/diagnose_mas_fid.py

      - name: Commit diagnostic output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostic_output || true
          if ! git diff --cached --quiet; then
            git commit -m "Add MAS FID diagnostic output"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mas-fid-diagnostic
          path: diagnostic_output/
          retention-days: 7
