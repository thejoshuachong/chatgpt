name: MAS FID Fast Extract

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  extract-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Extract and validate MAS directory
        id: extract
        continue-on-error: true
        run: python scripts/extract_mas_fid_fast.py

      - name: Commit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fast_output_v2 || true
          if ! git diff --cached --quiet; then
            git commit -m "Add reconciled MAS FID extraction output"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mas-fid-reconciled-output
          path: fast_output_v2/
          retention-days: 7

      - name: Enforce validation
        if: steps.extract.outcome != 'success'
        run: exit 1
