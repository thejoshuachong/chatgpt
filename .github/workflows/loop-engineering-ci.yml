name: Loop Engineering Estate CI

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "loop-engineering/**"
      - ".github/workflows/loop-engineering-ci.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "loop-engineering/**"
      - ".github/workflows/loop-engineering-ci.yml"

permissions:
  contents: read

jobs:
  validate-estate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loop-engineering
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest
      - name: Generate canonical registry
        run: python scripts/generate_registry.py
      - name: Run estate assurance tests
        run: pytest
      - name: Confirm generated registry exists
        run: test -s registry/assets.json
